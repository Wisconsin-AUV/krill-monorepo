version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/wauv/krill/api/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../api/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: ../api/gen
    opt:
      - paths=source_relative
      - simple
  - remote: buf.build/bufbuild/es:v2.15.0
    out: ../web/src/gen
    opt:
      - target=ts
      - erasable_syntax=true
  - remote: buf.build/protocolbuffers/python
    out: ../worker/gen
  - remote: buf.build/protocolbuffers/pyi
    out: ../worker/gen
