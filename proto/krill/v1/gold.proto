syntax = "proto3";

package krill.v1;

import "google/protobuf/timestamp.proto";
import "krill/v1/annotation.proto";
import "krill/v1/stats.proto";

// GoldService scores labelers against gold frames: labeled frames whose boxes
// are saved as an answer key. The queue hands each labeler a gold frame every
// so often, and they label it without seeing the key.
service GoldService {
  // SetGoldFrame saves the frame's boxes as its answer key. The frame must be
  // labeled or empty. Unsetting it deletes every attempt on it.
  rpc SetGoldFrame(SetGoldFrameRequest) returns (SetGoldFrameResponse) {}
  // GetGoldCheck fails with FailedPrecondition when the caller already
  // answered this frame.
  rpc GetGoldCheck(GetGoldCheckRequest) returns (GetGoldCheckResponse) {}
  // SubmitGoldCheck scores the caller's boxes and reveals the answer key.
  // Each labeler answers a gold frame once.
  rpc SubmitGoldCheck(SubmitGoldCheckRequest) returns (SubmitGoldCheckResponse) {}
  rpc GetGoldStats(GetGoldStatsRequest) returns (GetGoldStatsResponse) {}
  // GetGoldAttempt is open to reviewers and to the labeler who answered.
  rpc GetGoldAttempt(GetGoldAttemptRequest) returns (GetGoldAttemptResponse) {}
  // ListGoldAttempts lists attempts newest first. Labelers who are not
  // reviewers can only list their own.
  rpc ListGoldAttempts(ListGoldAttemptsRequest) returns (ListGoldAttemptsResponse) {}
}

message GoldBox {
  int64 label_type_id = 1;
  map<string, string> attributes = 2;
  Box box = 3;
}

// GoldMatch pairs a reference box with an answer box of the same type.
message GoldMatch {
  // Indexes into GoldResult.reference and GoldResult.answer.
  int32 reference = 1;
  int32 answer = 2;
  double iou = 3;
  // The box is tight enough and every attribute matches.
  bool correct = 4;
}

message GoldResult {
  repeated GoldBox reference = 1;
  repeated GoldBox answer = 2;
  // Unmatched reference boxes were missed, and unmatched answer boxes are
  // extra.
  repeated GoldMatch matches = 3;
  // Correct boxes over reference plus extra boxes. 1 for an empty frame
  // answered empty.
  double score = 4;
}

message SetGoldFrameRequest {
  int64 frame_id = 1;
  bool gold = 2;
}

message SetGoldFrameResponse {}

message GetGoldCheckRequest {
  int64 frame_id = 1;
}

message GetGoldCheckResponse {
  int64 frame_id = 1;
  // Presigned MinIO URL.
  string url = 2;
  int32 width = 3;
  int32 height = 4;
}

message SubmitGoldCheckRequest {
  int64 frame_id = 1;
  // Empty when the caller thinks the frame has no objects.
  repeated GoldBox boxes = 2;
}

message SubmitGoldCheckResponse {
  GoldResult result = 1;
}

message GetGoldStatsRequest {}

message GoldLabeler {
  Profile user = 1;
  int32 attempts = 2;
  // Correct boxes over reference plus extra boxes, across every attempt.
  double accuracy = 3;
  // Over matched boxes. 0 when nothing matched.
  double mean_iou = 4;
  // Their recent gold scores are low, so frames they finish go to review.
  bool needs_review = 5;
}

message GoldFrame {
  int64 frame_id = 1;
  int64 clip_id = 2;
  // Index within the video.
  int32 index = 3;
  string video_name = 4;
  string thumbnail_url = 5;
  int32 box_count = 6;
  int32 attempts = 7;
  // Mean score over attempts. 0 when there are none.
  double mean_score = 8;
}

message GetGoldStatsResponse {
  // Labelers with at least one attempt, least accurate first.
  repeated GoldLabeler labelers = 1;
  // Newest first.
  repeated GoldFrame frames = 2;
}

// GoldAttempt is one labeler's answer to one gold frame.
message GoldAttempt {
  int64 frame_id = 1;
  Profile user = 2;
  int64 clip_id = 3;
  // Index of the frame within the video.
  int32 index = 4;
  string video_name = 5;
  double score = 6;
  // Over matched boxes. 0 when nothing matched.
  double mean_iou = 7;
  google.protobuf.Timestamp created_at = 8;
}

message GetGoldAttemptRequest {
  int64 frame_id = 1;
  string user_id = 2;
}

message GetGoldAttemptResponse {
  GoldAttempt attempt = 1;
  GoldResult result = 2;
  // Presigned MinIO URL.
  string url = 3;
  int32 width = 4;
  int32 height = 5;
}

message ListGoldAttemptsRequest {
  // Empty lists every labeler.
  string user_id = 1;
  // 0 lists every gold frame.
  int64 frame_id = 2;
  // Defaults to 20, at most 100.
  int32 page_size = 3;
  string page_token = 4;
}

message ListGoldAttemptsResponse {
  repeated GoldAttempt attempts = 1;
  // Empty on the last page.
  string next_page_token = 2;
}
