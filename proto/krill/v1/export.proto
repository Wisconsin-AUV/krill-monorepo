syntax = "proto3";

package krill.v1;

import "google/protobuf/timestamp.proto";

// ExportService builds YOLO datasets. Train, val, and test are split by video,
// never by frame, and only frames marked labeled or empty are exported.
service ExportService {
  // PreviewExport plans an export without writing anything.
  rpc PreviewExport(PreviewExportRequest) returns (PreviewExportResponse) {}
  rpc CreateExport(CreateExportRequest) returns (CreateExportResponse) {}
  rpc ListExports(ListExportsRequest) returns (ListExportsResponse) {}
  rpc DeleteExport(DeleteExportRequest) returns (DeleteExportResponse) {}
  // GetExportDefaults returns the options set in the admin panel.
  rpc GetExportDefaults(GetExportDefaultsRequest) returns (GetExportDefaultsResponse) {}
}

enum ExportStatus {
  EXPORT_STATUS_UNSPECIFIED = 0;
  EXPORT_STATUS_QUEUED = 1;
  EXPORT_STATUS_RUNNING = 2;
  EXPORT_STATUS_READY = 3;
  EXPORT_STATUS_FAILED = 4;
}

message ExportOptions {
  // Share of images to put in val, from 0 to 0.5. Videos pinned to a split
  // keep it; the rest are balanced toward this share.
  float val_fraction = 1;
  // Keep every Nth exportable frame of each video. 1 keeps all.
  int32 stride = 2;
  bool dedup = 3;
  // Frames whose dHash differs from the last kept frame by at most this
  // many bits are dropped as near-duplicates.
  int32 dedup_distance = 4;
  // Videos to include. Empty means every ready video.
  repeated int64 video_ids = 5;
  // Augmented copies written of each train image, from 0 to 10.
  int32 augmented_copies = 6;
  // Unset uses the defaults. Mosaic is left to whatever trains on the
  // export.
  Augmentation augmentation = 7;
}

// Augmentation is how training images are varied, each epoch while training
// and in the augmented copies an export writes. Val and test images are never
// changed.
message Augmentation {
  // Ultralytics' own, in its units. Rotation in degrees either way.
  float degrees = 1;
  // Shift as a share of the image size, either way.
  float translate = 2;
  // Zoom gain either way.
  float scale = 3;
  // Degrees either way.
  float shear = 4;
  float perspective = 5;
  // Hue, saturation, and brightness gains either way.
  float hsv_h = 6;
  float hsv_s = 7;
  float hsv_v = 8;
  // Probabilities. Mirroring is off by default because it changes what
  // arrows and printed signs mean.
  float fliplr = 9;
  float flipud = 10;
  float mosaic = 11;
  // Krill's own, applied to each image before mosaic. The most an image is
  // stretched wider or taller, as a ratio of at least 1.
  float aspect = 12;
  // Probabilities that an image is tinted blue-green like water, gets
  // patches of light and shadow, or gets sensor noise.
  float underwater = 13;
  float shadows = 14;
  float noise = 15;
  // Probability that an image's objects are cut out and pasted at random
  // spots on a random distractor image, each resized, rotated, stretched, and
  // recolored on its own. Does nothing until distractors are added.
  float distractors = 16;
}

message ExportClassStats {
  int32 id = 1;
  string name = 2;
  int32 train_boxes = 3;
  int32 val_boxes = 4;
  // Distinct clips and videos with at least one box of this class. Frame
  // counts overstate variety because tracked frames are near-identical.
  int32 clips = 5;
  int32 videos = 6;
  int32 test_boxes = 7;
}

message ExportVideoStats {
  int64 video_id = 1;
  string name = 2;
  // "train", "val", or "test".
  string split = 3;
  bool pinned = 4;
  int32 images = 5;
  int32 boxes = 6;
}

message ExportStats {
  int32 train_images = 1;
  int32 val_images = 2;
  int32 train_boxes = 3;
  int32 val_boxes = 4;
  // Images with no boxes, exported as negatives.
  int32 negative_images = 5;
  // Frames not yet marked labeled or empty.
  int32 unlabeled_frames = 6;
  // Frames dropped because a track on them is missing an attribute.
  int32 incomplete_frames = 7;
  // Frames dropped because they hold unverified proposals, or boxes of a
  // track whose last box is unverified.
  int32 unverified_frames = 8;
  int32 stride_skipped = 9;
  int32 duplicate_skipped = 10;
  repeated ExportClassStats classes = 11;
  repeated ExportVideoStats videos = 12;
  int32 test_images = 13;
  int32 test_boxes = 14;
  // Labels are written as YOLO-OBB corners because a label type is
  // oriented. Boxes of other types are written as unrotated corners.
  bool oriented = 15;
  // Augmented copies of train images, on top of train_images.
  int32 augmented_images = 16;
}

message Export {
  int64 id = 1;
  string name = 2;
  ExportStatus status = 3;
  string error = 4;
  // 0 to 1 while running.
  float progress = 5;
  ExportOptions options = 6;
  ExportStats stats = 7;
  int64 size_bytes = 8;
  string download_url = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp finished_at = 11;
}

message PreviewExportRequest {
  ExportOptions options = 1;
}

message PreviewExportResponse {
  ExportStats stats = 1;
}

message CreateExportRequest {
  string name = 1;
  ExportOptions options = 2;
}

message CreateExportResponse {
  Export export = 1;
}

message ListExportsRequest {}

message ListExportsResponse {
  repeated Export exports = 1;
}

message DeleteExportRequest {
  int64 id = 1;
}

message DeleteExportResponse {}

message GetExportDefaultsRequest {}

message GetExportDefaultsResponse {
  ExportOptions options = 1;
}
