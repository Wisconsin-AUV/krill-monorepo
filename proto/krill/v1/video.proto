syntax = "proto3";

package krill.v1;

import "google/protobuf/timestamp.proto";
import "krill/v1/stats.proto";

service VideoService {
  // CreateVideo registers a video and starts a multipart upload. The browser
  // PUTs each part_size chunk of the file to the matching part URL, then
  // calls StartIngest with the upload ID.
  rpc CreateVideo(CreateVideoRequest) returns (CreateVideoResponse) {}
  // StartIngest queues frame extraction. It also retries a failed ingest.
  rpc StartIngest(StartIngestRequest) returns (StartIngestResponse) {}
  rpc ListVideos(ListVideosRequest) returns (ListVideosResponse) {}
  rpc GetVideo(GetVideoRequest) returns (GetVideoResponse) {}
  rpc UpdateVideo(UpdateVideoRequest) returns (UpdateVideoResponse) {}
  rpc DeleteVideo(DeleteVideoRequest) returns (DeleteVideoResponse) {}
}

enum VideoStatus {
  VIDEO_STATUS_UNSPECIFIED = 0;
  VIDEO_STATUS_UPLOADING = 1;
  VIDEO_STATUS_QUEUED = 2;
  VIDEO_STATUS_PROCESSING = 3;
  VIDEO_STATUS_READY = 4;
  VIDEO_STATUS_FAILED = 5;
}

// SplitAssignment pins a video to a dataset split. Export balances AUTO
// videos between train and val.
enum SplitAssignment {
  SPLIT_ASSIGNMENT_UNSPECIFIED = 0;
  SPLIT_ASSIGNMENT_AUTO = 1;
  SPLIT_ASSIGNMENT_TRAIN = 2;
  SPLIT_ASSIGNMENT_VAL = 3;
}

message Video {
  int64 id = 1;
  string name = 2;
  string filename = 3;
  string notes = 4;
  VideoStatus status = 5;
  string error = 6;
  // 0 to 1 while the video is processing.
  float ingest_progress = 7;
  SplitAssignment split = 8;
  // Frames per second extracted from the source. 0 means native rate.
  double extract_fps = 9;
  int32 width = 10;
  int32 height = 11;
  double fps = 12;
  int64 duration_ms = 13;
  int32 frame_count = 14;
  int32 clip_count = 15;
  string thumbnail_url = 16;
  google.protobuf.Timestamp created_at = 17;
  // Frames marked labeled or empty.
  int32 labeled_frame_count = 18;
  int32 box_count = 19;
}

message Clip {
  int64 id = 1;
  int64 video_id = 2;
  int32 index = 3;
  int32 start_frame = 4;
  int32 frame_count = 5;
  int64 start_ms = 6;
  int64 duration_ms = 7;
  string thumbnail_url = 8;
  int32 labeled_frame_count = 9;
  int32 box_count = 10;
  // Unset when nobody has claimed the clip.
  ClipClaim claim = 11;
}

// ClipClaim is who is labeling a clip. Claims are soft: anyone can still open
// and edit a claimed clip, but the queue does not hand it out.
message ClipClaim {
  Profile user = 1;
  google.protobuf.Timestamp active_at = 2;
  // False once the claimant has been idle long enough that the queue can
  // give the clip to someone else.
  bool active = 3;
}

message CreateVideoRequest {
  string name = 1;
  string filename = 2;
  double extract_fps = 3;
  int64 size = 4;
}

message CreateVideoResponse {
  reserved 2;
  reserved "upload_url";
  Video video = 1;
  string upload_id = 3;
  int64 part_size = 4;
  repeated string part_urls = 5;
}

message StartIngestRequest {
  int64 video_id = 1;
  // Completes this multipart upload first. Leave empty to retry an ingest.
  string upload_id = 2;
}

message StartIngestResponse {
  Video video = 1;
}

message ListVideosRequest {}

message ListVideosResponse {
  repeated Video videos = 1;
}

message GetVideoRequest {
  int64 id = 1;
}

message GetVideoResponse {
  Video video = 1;
  repeated Clip clips = 2;
}

message UpdateVideoRequest {
  int64 id = 1;
  optional string name = 2;
  optional string notes = 3;
  optional SplitAssignment split = 4;
}

message UpdateVideoResponse {
  Video video = 1;
}

message DeleteVideoRequest {
  int64 id = 1;
}

message DeleteVideoResponse {}
