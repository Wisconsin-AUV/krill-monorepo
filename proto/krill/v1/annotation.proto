syntax = "proto3";

package krill.v1;

service AnnotationService {
  // CreateTrack starts a track with its first box.
  rpc CreateTrack(CreateTrackRequest) returns (CreateTrackResponse) {}
  rpc UpdateTrack(UpdateTrackRequest) returns (UpdateTrackResponse) {}
  rpc DeleteTrack(DeleteTrackRequest) returns (DeleteTrackResponse) {}
  // SetBox creates or replaces the track's box on a frame.
  rpc SetBox(SetBoxRequest) returns (SetBoxResponse) {}
  // DeleteBox removes the track's box on a frame. A track left with no boxes
  // is deleted too.
  rpc DeleteBox(DeleteBoxRequest) returns (DeleteBoxResponse) {}
  // CopyBoxes copies boxes from one frame to another in the same clip,
  // skipping tracks that already have a box on the target frame.
  rpc CopyBoxes(CopyBoxesRequest) returns (CopyBoxesResponse) {}
  // SetFrameStatus to labeled also accepts the frame's proposed boxes.
  rpc SetFrameStatus(SetFrameStatusRequest) returns (SetFrameStatusResponse) {}
  // TrackObject segments an object from a point or box on one frame, then
  // tracks it through the rest of the clip on the GPU worker. Boxes are added
  // to the track as proposals while tracking runs.
  rpc TrackObject(TrackObjectRequest) returns (TrackObjectResponse) {}
}

enum FrameStatus {
  FRAME_STATUS_UNSPECIFIED = 0;
  FRAME_STATUS_UNLABELED = 1;
  // Every object in the frame has a box.
  FRAME_STATUS_LABELED = 2;
  // The frame has no objects and is exported as a negative example.
  FRAME_STATUS_EMPTY = 3;
}

enum AnnotationSource {
  ANNOTATION_SOURCE_UNSPECIFIED = 0;
  ANNOTATION_SOURCE_HUMAN = 1;
  ANNOTATION_SOURCE_SAM = 2;
  ANNOTATION_SOURCE_YOLO = 3;
  ANNOTATION_SOURCE_CV = 4;
}

enum AnnotationStatus {
  ANNOTATION_STATUS_UNSPECIFIED = 0;
  ANNOTATION_STATUS_PROPOSED = 1;
  ANNOTATION_STATUS_VERIFIED = 2;
  ANNOTATION_STATUS_REJECTED = 3;
}

// Box is normalized to the frame size, with the origin at the top left.
message Box {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}

// Point is normalized to the frame size, with the origin at the top left.
message Point {
  double x = 1;
  double y = 2;
}

message Track {
  int64 id = 1;
  int64 clip_id = 2;
  int64 label_type_id = 3;
  // Attribute name to option. Unset attributes are missing from the map.
  map<string, string> attributes = 4;
}

message Annotation {
  int64 id = 1;
  int64 track_id = 2;
  int64 frame_id = 3;
  Box box = 4;
  AnnotationSource source = 5;
  AnnotationStatus status = 6;
}

message CreateTrackRequest {
  int64 clip_id = 1;
  int64 label_type_id = 2;
  map<string, string> attributes = 3;
  int64 frame_id = 4;
  Box box = 5;
}

message CreateTrackResponse {
  Track track = 1;
  Annotation annotation = 2;
}

message UpdateTrackRequest {
  int64 id = 1;
  // Changing the type drops attributes the new type does not define.
  optional int64 label_type_id = 2;
  // Replaces all attributes when set_attributes is true.
  map<string, string> attributes = 3;
  bool set_attributes = 4;
}

message UpdateTrackResponse {
  Track track = 1;
}

message DeleteTrackRequest {
  int64 id = 1;
}

message DeleteTrackResponse {}

message SetBoxRequest {
  int64 track_id = 1;
  int64 frame_id = 2;
  Box box = 3;
}

message SetBoxResponse {
  Annotation annotation = 1;
}

message DeleteBoxRequest {
  int64 track_id = 1;
  int64 frame_id = 2;
}

message DeleteBoxResponse {
  bool track_deleted = 1;
}

message CopyBoxesRequest {
  int64 from_frame_id = 1;
  int64 to_frame_id = 2;
  // Copy only these tracks. Empty copies every track on the source frame.
  repeated int64 track_ids = 3;
}

message CopyBoxesResponse {
  repeated Annotation annotations = 1;
}

message SetFrameStatusRequest {
  int64 frame_id = 1;
  FrameStatus status = 2;
}

message SetFrameStatusResponse {
  FrameStatus status = 1;
}

message TrackObjectRequest {
  int64 frame_id = 1;
  // Track to retrack from this frame. When 0, a new track of label_type_id is
  // created.
  int64 track_id = 2;
  int64 label_type_id = 3;
  map<string, string> attributes = 4;
  oneof prompt {
    Point point = 5;
    // Saved as the track's box on this frame before tracking.
    Box box = 6;
  }
}

message TrackObjectResponse {
  Track track = 1;
}
