syntax = "proto3";

package krill.v1;

import "google/protobuf/timestamp.proto";

// LogService shows the latest log records of the API and each GPU worker.
// Only the most recent records are kept, in memory, so a restart clears them.
service LogService {
  rpc ListLogSources(ListLogSourcesRequest) returns (ListLogSourcesResponse) {}
  // ListLogs returns matching records, oldest first.
  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse) {}
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
}

message LogAttr {
  // Dotted for attributes in a group, like job.id.
  string key = 1;
  string value = 2;
}

message LogRecord {
  // Increases by one with each record from a source, so a client can ask for
  // the records after the last one it has.
  int64 seq = 1;
  google.protobuf.Timestamp time = 2;
  LogLevel level = 3;
  string message = 4;
  repeated LogAttr attrs = 5;
}

message LogSource {
  // "api" or a worker's instance ID.
  string id = 1;
  bool worker = 2;
  string hostname = 3;
  bool online = 4;
  google.protobuf.Timestamp last_seen = 5;
}

message ListLogSourcesRequest {}

message ListLogSourcesResponse {
  // The API first, then workers by when they were last seen.
  repeated LogSource sources = 1;
}

message ListLogsRequest {
  // Defaults to the API.
  string source_id = 1;
  // Records at this level and above. Unspecified includes every level.
  LogLevel min_level = 2;
  // Case-insensitive text in the message or an attribute.
  string query = 3;
  // Only records after this seq. 0 returns the latest.
  int64 after_seq = 4;
  // Defaults to 500, at most 2000. The newest records win.
  int32 limit = 5;
}

message ListLogsResponse {
  repeated LogRecord records = 1;
  // The source's newest seq, whether or not it matched, to pass as after_seq
  // next time.
  int64 last_seq = 2;
}
