syntax = "proto3";

package krill.v1;

import "google/protobuf/timestamp.proto";
import "krill/v1/annotation.proto";
import "krill/v1/log.proto";
import "krill/v1/pipeline.proto";
import "krill/v1/system.proto";

// WorkerService is called by the GPU worker. Requests carry a worker token
// instead of a user session.
service WorkerService {
  // NextTask waits up to 30 seconds for work and returns no task if none
  // arrives.
  rpc NextTask(NextTaskRequest) returns (NextTaskResponse) {}
  // ReportTrack saves boxes for a track task. Workers report in batches as
  // they go, and set done on the last one.
  rpc ReportTrack(ReportTrackRequest) returns (ReportTrackResponse) {}
  // ReportExemplars finishes an exemplar task with every object found.
  rpc ReportExemplars(ReportExemplarsRequest) returns (ReportExemplarsResponse) {}
  // ReportEmbed finishes an embed task once every frame's embedding is
  // uploaded.
  rpc ReportEmbed(ReportEmbedRequest) returns (ReportEmbedResponse) {}
  rpc FailTask(FailTaskRequest) returns (FailTaskResponse) {}
  // Heartbeat reports the worker's state every few seconds for the admin
  // panel. A worker that stops sending them shows as offline.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {}
}

message NextTaskRequest {}

message NextTaskResponse {
  oneof task {
    TrackTask track = 1;
    ExemplarTask exemplar = 2;
    EmbedTask embed = 3;
    TrainTask train = 10;
    PrelabelTask prelabel = 11;
    PreviewTask preview = 12;
  }
}

message TaskFrame {
  int64 id = 1;
  // Presigned URL for the worker, not the browser.
  string url = 2;
  // Presigned URL of the frame's image embedding. Empty when the clip has
  // none.
  string embedding_url = 3;
}

message TrackTask {
  int64 id = 1;
  // Frames in order. The prompt is on the first one.
  repeated TaskFrame frames = 2;
  oneof prompt {
    Point point = 3;
    Box box = 4;
  }
  // Model that computed the frames' embeddings. Workers running a different
  // model ignore them.
  string embedding_model = 5;
}

// EmbedTask computes the SAM image embedding of each frame.
message EmbedTask {
  int64 id = 1;
  repeated EmbedFrame frames = 2;
}

message EmbedFrame {
  int64 id = 1;
  // Presigned URL for the worker to GET the frame.
  string url = 2;
  // Presigned URL for the worker to PUT the embedding.
  string upload_url = 3;
}

// ExemplarTask finds every object on a frame that looks like the one in box.
message ExemplarTask {
  int64 id = 1;
  TaskFrame frame = 2;
  Box box = 3;
}

message TrackedBox {
  int64 frame_id = 1;
  Box box = 2;
}

message ReportTrackRequest {
  int64 task_id = 1;
  // Stored as the model version on each box.
  string model = 2;
  repeated TrackedBox boxes = 3;
  bool done = 4;
}

message ReportTrackResponse {}

message ReportExemplarsRequest {
  int64 task_id = 1;
  string model = 2;
  // May include the exemplar itself.
  repeated Box boxes = 3;
}

message ReportExemplarsResponse {}

message ReportEmbedRequest {
  int64 task_id = 1;
  string model = 2;
}

message ReportEmbedResponse {}

message FailTaskRequest {
  int64 task_id = 1;
  string error = 2;
}

message FailTaskResponse {}

message HeartbeatRequest {
  // Random for each process, so a restarted worker shows as a new one.
  string instance_id = 1;
  string hostname = 2;
  string version = 3;
  string model = 4;
  string accelerator = 5;
  google.protobuf.Timestamp started_at = 6;
  HostStats host = 7;
  repeated GpuStats gpus = 8;
  // The task being worked on, or 0 when idle.
  int64 task_id = 9;
  // Log records not yet sent, oldest first. A worker resends them until a
  // heartbeat succeeds, so the API skips seqs it already has.
  repeated LogRecord logs = 20;
  ModelLoadState model_state = 30;
  // Why the model failed to load.
  string model_error = 31;
  // Torch memory once the model loaded and warmed up.
  uint64 model_memory_allocated_bytes = 32;
  uint64 model_memory_reserved_bytes = 33;
  // Set when the worker's own KRILL_SAM_MODEL picks the model, which then
  // ignores HeartbeatResponse.model.
  string pinned_model = 34;
  // SAM models already downloaded to the worker.
  repeated string cached_models = 35;
  // The last command the worker finished, so the API stops sending it.
  uint64 command_id = 36;
  // Whether the model can run exemplar tasks.
  bool supports_exemplars = 37;
}

enum ModelLoadState {
  MODEL_LOAD_STATE_UNSPECIFIED = 0;
  // Nothing is loaded. The next task loads the model.
  MODEL_LOAD_STATE_UNLOADED = 1;
  MODEL_LOAD_STATE_LOADING = 2;
  MODEL_LOAD_STATE_READY = 3;
  MODEL_LOAD_STATE_ERROR = 4;
}

message HeartbeatResponse {
  // The SAM model to switch to between tasks. Empty leaves the worker's
  // default.
  string model = 30;
  // Sent in every response until the worker reports its id.
  WorkerCommand command = 31;
  // A task the API no longer waits on, such as a cancelled job. The worker
  // stops it without reporting a failure.
  int64 cancel_task_id = 32;
}

message WorkerCommand {
  uint64 id = 1;
  WorkerAction action = 2;
}

enum WorkerAction {
  WORKER_ACTION_UNSPECIFIED = 0;
  // Load the model and compile its kernels now instead of on the next task.
  WORKER_ACTION_WARM_UP = 1;
  // Free the GPU memory. The next task loads the model again.
  WORKER_ACTION_UNLOAD = 2;
}
