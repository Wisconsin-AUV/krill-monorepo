syntax = "proto3";

package krill.v1;

import "krill/v1/annotation.proto";

// WorkerService is called by the GPU worker. Requests carry the shared worker
// token instead of a user session.
service WorkerService {
  // NextTask waits up to 30 seconds for work and returns no task if none
  // arrives.
  rpc NextTask(NextTaskRequest) returns (NextTaskResponse) {}
  // ReportTrack saves boxes for a track task. Workers report in batches as
  // they go, and set done on the last one.
  rpc ReportTrack(ReportTrackRequest) returns (ReportTrackResponse) {}
  // ReportEmbed finishes an embed task once every frame's embedding is
  // uploaded.
  rpc ReportEmbed(ReportEmbedRequest) returns (ReportEmbedResponse) {}
  rpc FailTask(FailTaskRequest) returns (FailTaskResponse) {}
}

message NextTaskRequest {}

// At most one task is set.
message NextTaskResponse {
  TrackTask track = 1;
  EmbedTask embed = 2;
}

message TaskFrame {
  int64 id = 1;
  // Presigned URL for the worker, not the browser.
  string url = 2;
  // Presigned URL of the frame's image embedding. Empty when the clip has
  // none.
  string embedding_url = 3;
}

message TrackTask {
  int64 id = 1;
  // Frames in order. The prompt is on the first one.
  repeated TaskFrame frames = 2;
  oneof prompt {
    Point point = 3;
    Box box = 4;
  }
  // Model that computed the frames' embeddings. Workers running a different
  // model ignore them.
  string embedding_model = 5;
}

// EmbedTask computes the SAM image embedding of each frame.
message EmbedTask {
  int64 id = 1;
  repeated EmbedFrame frames = 2;
}

message EmbedFrame {
  int64 id = 1;
  // Presigned URL for the worker to GET the frame.
  string url = 2;
  // Presigned URL for the worker to PUT the embedding.
  string upload_url = 3;
}

message TrackedBox {
  int64 frame_id = 1;
  Box box = 2;
}

message ReportTrackRequest {
  int64 task_id = 1;
  // Stored as the model version on each box.
  string model = 2;
  repeated TrackedBox boxes = 3;
  bool done = 4;
}

message ReportTrackResponse {}

message ReportEmbedRequest {
  int64 task_id = 1;
  string model = 2;
}

message ReportEmbedResponse {}

message FailTaskRequest {
  int64 task_id = 1;
  string error = 2;
}

message FailTaskResponse {}
